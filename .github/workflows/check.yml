name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate the prod-target Dockerfile still builds
        uses: mattjmorrison-homelab/actions-k8s@bcd046d4581cc4ffce4de813396f81420ce32e30 # main
        with:
          service-account: docker-backstage-job
          image: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
          shell: "false"
          command: >-
            --context=git://github.com/mattjmorrison-homelab/docker-backstage.git#refs/heads/${{ github.head_ref }}
            --dockerfile=Dockerfile --skip-unused-stages=true --target=prod --no-push
          active-deadline-seconds: "1800"

      - name: Validate the test-target Dockerfile still builds
        uses: mattjmorrison-homelab/actions-k8s@bcd046d4581cc4ffce4de813396f81420ce32e30 # main
        with:
          service-account: docker-backstage-job
          image: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
          shell: "false"
          command: >-
            --context=git://github.com/mattjmorrison-homelab/docker-backstage.git#refs/heads/${{ github.head_ref }}
            --dockerfile=Dockerfile --skip-unused-stages=true --target=test --no-push
          active-deadline-seconds: "1800"
