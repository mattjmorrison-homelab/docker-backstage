name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and push the prod target
        uses: mattjmorrison-homelab/actions-k8s@c65e886f38d1563b4aaf6335667e971a1438a2d5 # main
        with:
          service-account: docker-backstage-job
          image: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
          shell: "false"
          command: >-
            --context=git://github.com/mattjmorrison-homelab/docker-backstage.git#refs/heads/main
            --dockerfile=Dockerfile --skip-unused-stages=true --target=prod
            --destination=registry.morrisons.site/docker-backstage:prod
          secret-volume: docker-backstage-zot-pull-secret:/kaniko/.docker
          active-deadline-seconds: "1800"

      - name: Build and push the test target
        uses: mattjmorrison-homelab/actions-k8s@c65e886f38d1563b4aaf6335667e971a1438a2d5 # main
        with:
          service-account: docker-backstage-job
          image: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
          shell: "false"
          command: >-
            --context=git://github.com/mattjmorrison-homelab/docker-backstage.git#refs/heads/main
            --dockerfile=Dockerfile --skip-unused-stages=true --target=test
            --destination=registry.morrisons.site/docker-backstage:test
          secret-volume: docker-backstage-zot-pull-secret:/kaniko/.docker
          active-deadline-seconds: "1800"
